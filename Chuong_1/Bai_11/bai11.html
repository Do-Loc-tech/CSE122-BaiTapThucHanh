<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11 — Thư viện ảnh (figure / figcaption)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="gallery-wrapper">
        <header class="gallery-header">
            <h2>Thư viện ảnh Việt Nam</h2>
            <p>Bộ sưu tập 6 danh thắng tiêu biểu — minh hoạ thẻ figure / figcaption.</p>
        </header>

        <main class="gallery-grid">
            <figure class="gallery-item">
                <img src="img/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="img/2-son-doong.jpg" alt="Hang Sơn Đoòng">
                <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="img/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                <figcaption>Hình 3. Thác Bản Giốc</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="img/4-fansipan.jpg" alt="Fansipan">
                <figcaption>Hình 4. Fansipan</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="img/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="img/6-phong-nha.jpg" alt="Động Phong Nha">
                <figcaption>Hình 6. Động Phong Nha</figcaption>
            </figure>
        </main>
    </div>

</body>
</html>
