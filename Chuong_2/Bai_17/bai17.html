<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 17 - Đăng ký tài khoản</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <form id="register-form" onsubmit="validateForm(event)" novalidate>
        <h2>Đăng ký tài khoản</h2>
        <p class="subtitle">Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>

        <div class="form-group" id="group-fullname">
            <label for="fullname">Họ và tên</label>
            <input type="text" id="fullname" value="Nguyễn Văn An">
            <div class="message"></div>
        </div>

        <div class="form-group" id="group-email">
            <label for="email">Email</label>
            <input type="email" id="email" value="an.nv@">
            <div class="message"></div>
        </div>

        <div class="form-group" id="group-password">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" value="...">
            <div class="message"></div>
        </div>

        <div class="form-group" id="group-confirm-password">
            <label for="confirm-password">Xác nhận mật khẩu</label>
            <input type="password" id="confirm-password" value="******">
            <div class="message"></div>
        </div>

        <button type="submit">Đăng ký</button>
    </form>

    <script src="js/script.js"></script>
</body>
</html>
