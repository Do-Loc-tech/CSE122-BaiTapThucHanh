<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - Danh sách việc cần làm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="todo-app">
        <div class="header">
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </div>

        <div class="content">
            <div class="input-section">
                <input type="text" id="todo-input" placeholder="Hoàn thành bài tập Lập trình Web">
                <button id="add-btn" onclick="addTodo()">Thêm</button>
            </div>

            <ul class="todo-list" id="todo-list">
                <li class="todo-item completed">
                    <div class="todo-left" onclick="toggleTodo(this)">
                        <div class="checkbox"></div>
                        <span class="todo-text">Đọc chương HTML5 cơ bản</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(this)">Xoá</button>
                </li>
                <li class="todo-item">
                    <div class="todo-left" onclick="toggleTodo(this)">
                        <div class="checkbox"></div>
                        <span class="todo-text">Làm bài tập CSS Grid</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(this)">Xoá</button>
                </li>
                <li class="todo-item">
                    <div class="todo-left" onclick="toggleTodo(this)">
                        <div class="checkbox"></div>
                        <span class="todo-text">Quay video OBS nộp bài</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(this)">Xoá</button>
                </li>
            </ul>

            <div class="footer" id="todo-counter">
                Còn 2 việc chưa hoàn thành
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
