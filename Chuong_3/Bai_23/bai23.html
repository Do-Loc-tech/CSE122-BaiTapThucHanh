<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 23 - Thư viện ảnh hiệu ứng Hover</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header class="header-gallery">
            <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
            <p>Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </header>

        <div class="image-grid">
            <div class="grid-item">
                <img src="img/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                <div class="overlay">Vịnh Hạ Long</div>
            </div>
            <div class="grid-item">
                <img src="img/2-son-doong.jpg" alt="Hang Sơn Đoòng">
                <div class="overlay">Hang Sơn Đoòng</div>
            </div>
            <div class="grid-item">
                <img src="img/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                <div class="overlay">Thác Bản Giốc</div>
            </div>
            <div class="grid-item">
                <img src="img/4-fansipan.jpg" alt="Fansipan">
                <div class="overlay">Fansipan</div>
            </div>
            <div class="grid-item">
                <img src="img/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                <div class="overlay">Đồng bằng sông Cửu Long</div>
            </div>
            <div class="grid-item">
                <img src="img/6-phong-nha.jpg" alt="Động Phong Nha">
                <div class="overlay">Động Phong Nha</div>
            </div>
        </div>
    </div>

</body>
</html>
